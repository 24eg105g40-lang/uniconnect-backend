spring.application.name=uniconnect-backend
server.port=${PORT:8080}

# ================================================================
# Database Configuration (Neon PostgreSQL & Local Fallback)
# ================================================================
# For Neon PostgreSQL (Cloud / Render):
# Provide:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<neon-host>.neon.tech/<dbname>?sslmode=require
#   SPRING_DATASOURCE_USERNAME=<neon-user>
#   SPRING_DATASOURCE_PASSWORD=<neon-password>
#
# When running locally without Neon credentials, it gracefully uses an
# in-memory PostgreSQL-compatible database so the backend starts instantly!
# ================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:uniconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Enable H2 web console for quick database inspection in development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
